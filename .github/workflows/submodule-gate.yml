name: submodule-gate

on:
  push:
  pull_request:

env:
  # Force Node.js 24 runtime for all JavaScript actions in this workflow.
  # Node 20 is being removed from runners in September 2026.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  submodule-gate:
    name: submodule-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Verify SPEC_SHA matches submodule HEAD
        run: bash scripts/check_spec_sha.sh
