# Tier-4 Phase 3 — Playwright E2E conformance suite.
#
# Runs on:
#   - every PR (against a locally-booted server in the runner)
#   - every push to main (after deploy completes — workflow_run trigger)
# The nightly 06:00 UTC run against production was removed to stop
# recurring CI cost; run it manually from the Actions tab if needed.
#
# Per K4: every handle is namespaced with PLAYWRIGHT_RUN_ID
# (= github.run_id) so consecutive runs against shared production state
# don't collide. Acceptance: two consecutive nightly runs both pass with
# no manual cleanup.

name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_run:
    workflows: [deploy]
    types: [completed]
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # PR-only job: boot local Rust server, run e2e against it.
  e2e-pr:
    name: e2e (PR — local Rust server)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: npm install
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - uses: dtolnay/rust-toolchain@stable

      - name: Build server
        working-directory: ${{ github.workspace }}
        run: cargo build --release -p server

      - name: Boot local server
        working-directory: ${{ github.workspace }}
        run: |
          SEED_DEMO=true PORT=8080 ./target/release/server &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; then
              echo "server up"
              exit 0
            fi
            sleep 1
          done
          echo "server failed to start" >&2
          exit 1

      - name: Run Playwright tests
        env:
          BASE_URL: http://127.0.0.1:8080
          PLAYWRIGHT_RUN_ID: gha-${{ github.run_id }}
        run: npm test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-pr-${{ github.run_id }}
          path: e2e/playwright-report/
          retention-days: 14

  # Production / nightly job: matrix-fan over BOTH live backends. Same
  # Playwright suite, different BASE_URL — confirms the two impls are
  # behavior-equivalent at the conformance layer (the JSON envelope shape,
  # the sort order, the error-code mapping). When this passes against
  # both, the two backends are pre-Stream-2 confirmation that the spec
  # holds end-to-end on each independently.
  e2e-live:
    name: "e2e (live: ${{ matrix.target }})"
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: rust
            base_url: https://twitter-formal-rust.fly.dev
          - target: go
            base_url: https://twitter-formal-go.fly.dev
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: npm install
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests against ${{ matrix.target }}
        env:
          BASE_URL: ${{ matrix.base_url }}
          PLAYWRIGHT_RUN_ID: gha-${{ github.run_id }}-${{ matrix.target }}
        run: npm test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.target }}-${{ github.run_id }}
          path: e2e/playwright-report/
          retention-days: 14
