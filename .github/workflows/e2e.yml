# Tier-4 Phase 3 — Playwright E2E conformance suite.
#
# Runs on:
#   - every PR (against a locally-booted server in the runner)
#   - every push to main (after deploy completes — workflow_run trigger)
#   - nightly at 06:00 UTC (against production)
#
# Per K4: every handle is namespaced with PLAYWRIGHT_RUN_ID
# (= github.run_id) so consecutive runs against shared production state
# don't collide. Acceptance: two consecutive nightly runs both pass with
# no manual cleanup.

name: e2e

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * *"
  workflow_run:
    workflows: [deploy]
    types: [completed]
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    # On workflow_run, gate on the upstream deploy succeeding.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: npm install
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # ---------------------------------------------------------------
      # Choose target: local server for PRs, live production otherwise.
      # ---------------------------------------------------------------

      - name: Choose BASE_URL
        id: target
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base_url=http://127.0.0.1:8080" >> "$GITHUB_OUTPUT"
            echo "needs_local=true" >> "$GITHUB_OUTPUT"
          else
            echo "base_url=https://twitter-formal-rust.fly.dev" >> "$GITHUB_OUTPUT"
            echo "needs_local=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Rust toolchain (PR only)
        if: steps.target.outputs.needs_local == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Build server (PR only)
        if: steps.target.outputs.needs_local == 'true'
        working-directory: ${{ github.workspace }}
        run: cargo build --release -p server

      - name: Boot local server (PR only)
        if: steps.target.outputs.needs_local == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          SEED_DEMO=true PORT=8080 ./target/release/server &
          echo $! > /tmp/server.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; then
              echo "server up"
              exit 0
            fi
            sleep 1
          done
          echo "server failed to start" >&2
          exit 1

      - name: Run Playwright tests
        env:
          BASE_URL: ${{ steps.target.outputs.base_url }}
          PLAYWRIGHT_RUN_ID: gha-${{ github.run_id }}
        run: npm test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: e2e/playwright-report/
          retention-days: 14
