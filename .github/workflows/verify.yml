name: verify

on:
  push:
  pull_request:
  schedule:
    # Nightly full-bound TLC + Verus run, 07:00 UTC.
    - cron: "0 7 * * *"

env:
  # Opt JavaScript actions (actions/checkout, actions/cache,
  # actions/setup-java, etc.) onto the Node.js 24 runtime. Node 20 is
  # being removed from runners in September 2026; this var forces the
  # newer runtime now without bumping each action's pinned major.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Pinned Verus stable tag — bump in lockstep with the prebuilt URL.
  VERUS_VERSION: release/0.2026.04.24.f8e1704
  TLA_VERSION: 1.8.0

jobs:
  verus:
    name: verify / verus
    runs-on: ubuntu-latest
    # Tier 3 (O10): Verus runs via `cargo verus verify --workspace`, which
    # honors per-crate `[package.metadata.verus] verify = true` and exits
    # non-zero on any verification error. The previous per-file
    # `verus --crate-type=lib …` invocation could not resolve cross-crate
    # imports and was masked by `|| true`; that path is removed.
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Detect changed files (event-aware)
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            schedule)
              echo "scheduled run — forcing full verification"
              CHANGED=__force_full_run__
              ;;
            push)
              BEFORE='${{ github.event.before }}'
              if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
                echo "push without usable 'before' SHA — running full verification"
                CHANGED=__force_full_run__
              else
                CHANGED=$(git diff --name-only "$BEFORE..${{ github.sha }}" || echo __force_full_run__)
              fi
              ;;
            pull_request)
              git fetch origin '${{ github.base_ref }}'
              CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" || echo __force_full_run__)
              ;;
            *)
              CHANGED=__force_full_run__ ;;
          esac

          if [ "$CHANGED" = "__force_full_run__" ] || \
             echo "$CHANGED" | grep -qvE '^(README\.md|COVERAGE\.md|LICENSE|\.gitignore|Makefile|scripts/check_manifest)'; then
            echo "code-relevant or fail-safe — running heavy verifier"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skipped — docs-only PR"
            echo "skip=true"  >> "$GITHUB_OUTPUT"
          fi

      - name: Cache Verus prebuilt
        if: steps.detect.outputs.skip == 'false'
        id: cache-verus
        uses: actions/cache@v4
        with:
          path: ~/.verus
          key: verus-${{ env.VERUS_VERSION }}-${{ runner.os }}

      # Verus is pinned to a specific Rust toolchain (currently 1.95.0). Using
      # `dtolnay/rust-toolchain@stable` is wrong: stable may drift past the
      # version Verus was built against, causing `verus: required rust
      # toolchain X not found`. Pin to the exact version Verus expects.
      - uses: dtolnay/rust-toolchain@1.95.0
        if: steps.detect.outputs.skip == 'false'

      - name: Install Verus prebuilt (skip if cache hit)
        if: steps.detect.outputs.skip == 'false' && steps.cache-verus.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.verus"
          asset_version="${VERUS_VERSION##*/}"
          encoded_tag="${VERUS_VERSION//\//%2F}"
          asset="verus-${asset_version}-x86-linux.zip"
          url="https://github.com/verus-lang/verus/releases/download/${encoded_tag}/${asset}"
          curl -fsSL -o /tmp/verus.zip "$url"
          unzip -q /tmp/verus.zip -d "$HOME/.verus"

      - name: Add Verus + cargo-verus to PATH
        if: steps.detect.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          verus_bin=$(find "$HOME/.verus" -type f -name verus -perm -111 -print -quit 2>/dev/null || true)
          if [ -z "$verus_bin" ]; then
            echo "verus binary not found under $HOME/.verus — install failed" >&2
            ls -lR "$HOME/.verus" >&2
            exit 1
          fi
          dirname "$verus_bin" >> "$GITHUB_PATH"

      - name: Run Verus on workspace (cargo verus verify)
        if: steps.detect.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          # Honors per-crate [package.metadata.verus] verify = true.
          # Exits non-zero on any verification error — no || true.
          cargo verus verify --workspace

      - name: Skipped (docs-only)
        if: steps.detect.outputs.skip == 'true'
        run: echo "skipped — docs-only PR"

  tlc:
    name: verify / tlc
    runs-on: ubuntu-latest
    # Tier 3 (O10): TLC is reliable on the rightsized bound (141M states /
    # 9M distinct, ~4m21s on ubuntu-latest). Failures are real spec
    # violations and must fail the gate. Smoke recipe: introduce a
    # deliberately-false invariant in twitter-pr.cfg on a throwaway branch
    # and confirm this job goes red.
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Detect changed files (event-aware)
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            schedule)
              echo "scheduled run — forcing full verification"
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "tlc_cfg=specs/twitter.cfg" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            push)
              BEFORE='${{ github.event.before }}'
              if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
                echo "push without usable 'before' SHA — running full verification"
                CHANGED=__force_full_run__
              else
                CHANGED=$(git diff --name-only "$BEFORE..${{ github.sha }}" || echo __force_full_run__)
              fi
              ;;
            pull_request)
              git fetch origin '${{ github.base_ref }}'
              CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" || echo __force_full_run__)
              ;;
            *)
              CHANGED=__force_full_run__ ;;
          esac

          if [ "$CHANGED" = "__force_full_run__" ] || \
             echo "$CHANGED" | grep -qvE '^(README\.md|COVERAGE\.md|LICENSE|\.gitignore|Makefile|scripts/check_manifest)'; then
            echo "code-relevant or fail-safe — running heavy verifier"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skipped — docs-only PR"
            echo "skip=true"  >> "$GITHUB_OUTPUT"
          fi

          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tlc_cfg=specs/twitter.cfg"    >> "$GITHUB_OUTPUT"
          else
            echo "tlc_cfg=specs/twitter-pr.cfg" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.detect.outputs.skip == 'false'
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache tla2tools.jar
        if: steps.detect.outputs.skip == 'false'
        uses: actions/cache@v4
        with:
          path: /tmp/tla2tools-${{ env.TLA_VERSION }}.jar
          key: tla-${{ env.TLA_VERSION }}

      - name: Run TLC
        if: steps.detect.outputs.skip == 'false'
        env:
          TLA_VERSION: ${{ env.TLA_VERSION }}
        run: bash scripts/run_tlc.sh ${{ steps.detect.outputs.tlc_cfg }}

      - name: Skipped (docs-only)
        if: steps.detect.outputs.skip == 'true'
        run: echo "skipped — docs-only PR"

  # ---------------------------------------------------------------------------
  # Tier-4 Phase 1: build verified image after every verifier passes.
  # On main pushes, push to GHCR and emit the image-digest artifact that
  # deploy.yml promotes via `flyctl deploy --image @sha256:<digest>`.
  # ---------------------------------------------------------------------------

  build-image-pr:
    name: build-image (PR validation only)
    if: github.event_name == 'pull_request'
    needs: [verus, tlc]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read   # K6: PR runs do NOT get write to GHCR
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Validate Dockerfile builds (no push)
        run: docker build -t verify-build-only:${{ github.sha }} .

  build-image-main:
    name: build-image + push to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verus, tlc]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # K6: only main pushes can push images
    outputs:
      image_digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: "Build and push (pass 1: no version baked yet)"
        id: push1
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:pre-${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            IMAGE_DIGEST=sha256:pending
      - name: "Re-tag with version baked in (pass 2)"
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:git-${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            IMAGE_DIGEST=${{ steps.push1.outputs.digest }}
      - name: Write digest artifact
        run: echo "${{ steps.push.outputs.digest }}" > image-digest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ github.sha }}
          path: image-digest.txt
          retention-days: 14
